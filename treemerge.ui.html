  const undoBtn = c.pick != null ? h('button', { class: 'small', onclick: pick(null), text: c.t === 'conflict' ? 'Choose again' : 'Back to automatic' }) : h('button', { class: 'small', onclick: pick('base'), title: 'Leave these lines as they were before either side changed them', text: 'Do not apply' });
  return h('div', { class: 'card ' + (c.t === 'conflict' ? 'settled' : c.t) },
    h('div', { class: 'head' }, h('span', { class: 'what', text: who }), c.pick == null ? h('span', { style: 'color:var(--muted)', text: 'applied automatically' }) : null, h('div', { class: 'btns' }, undoBtn)),
    h('div', { class: 'body code' }, c.pick == null || c.pick !== 'base' ? (c.base || []).map(l => line(l, 'del', '-')) : [], (c.result || []).map(l => line(l, c.pick === 'base' ? '' : 'add', c.pick === 'base' ? ' ' : '+')), !(c.base || []).length && !(c.result || []).length ? lines([]) : []));
}
function textView(d) {
  const out = [], conf = d.chunks.filter(c => c.t === 'conflict'), firstOpen = conf.find(c => c.pick == null);
  if (d.custom) out.push(h('div', { class: 'banner info', text: 'You replaced this whole result by hand. "Start over" brings the blocks back.' }));
  if (S.edit && S.edit.whole) {
    const ta = h('textarea', { 'aria-label': 'Edit the whole result', spellcheck: 'false', style: 'min-height:55vh' }); ta.value = S.edit.text;
    out.push(h('div', { class: 'card' }, h('div', { class: 'head' }, h('span', { class: 'what', text: 'The whole result, as it will be written' })), ta,
      h('div', { class: 'editbar' }, h('button', { class: 'primary', onclick: guard(() => choose({ text: ta.value })), text: 'Use this' }), h('button', { onclick: () => { S.edit = null; renderMain(); }, text: 'Cancel' }))));
    return out;
  }
  let n = 0;
  for (const c of d.chunks) {
    if (c.t === 'same') {
      const body = c.lines ? c.lines.map(l => line(l)) : [...c.head.map(l => line(l)), h('div', { class: 'gap', text: (c.n - 6) + ' unchanged lines' }), ...c.tail.map(l => line(l))];
      out.push(h('div', { class: 'ctx code' }, body));

  }
  return out;
}
function valueView(d) {
  const baseLines = d.absent.base ? null : new Set(d.base.split('\n'));             // lines a side changed or added stand out
  const side = (name, cls, label) => {
    const absent = d.absent[name], cur = d.absent.result === absent && (absent || d.result === d[name]);
    const btn = name === 'base' ? h('button', { class: 'small', onclick: guard(() => choose({ side: 'base' })), text: absent ? 'Leave it out' : 'Keep the original' })
      : h('button', { class: 'small ' + cls, onclick: guard(() => choose({ side: name })) }, absent ? 'Leave it out' : 'Use ' + name, name === 'ours' ? h('kbd', { text: '1' }) : h('kbd', { text: '2' }));
    return h('div', { class: 'card' + (cur ? ' current' : '') }, h('div', { class: 'head' }, h('span', { class: 'tag ' + cls, text: label }), cur ? h('span', { class: 'badge', text: 'IN THE RESULT' }) : null, h('div', { class: 'btns' }, btn)),
      absent ? h('div', { class: 'val absent', text: d.kind === 'element' ? 'not there on this side' : 'not set on this side' })
        : h('div', { class: 'val code' }, d[name].split('\n').map(l => line(l, name !== 'base' && baseLines && !baseLines.has(l) ? 'add' : ''))));
  };
  const out = [h('div', { class: 'three' }, side('ours', 'ours', 'OURS · ' + S.doc.labels.ours), side('theirs', 'theirs', 'THEIRS · ' + S.doc.labels.theirs), side('base', 'base', 'ORIGINAL'))];
  if (S.edit && S.edit.whole) {
    const ta = h('textarea', { 'aria-label': 'Your own value', spellcheck: 'false' }); ta.value = S.edit.text;
    out.push(h('div', { class: 'card' }, h('div', { class: 'head' }, h('span', { class: 'what', text: d.isString ? 'Your own text' : 'Your own value, as JSON' })), ta,
      h('div', { class: 'editbar' }, h('button', { class: 'primary', onclick: guard(() => choose({ value: d.isString ? ta.value : JSON.parse(ta.value) })), text: 'Use this' }), h('button', { onclick: () => { S.edit = null; renderMain(); }, text: 'Cancel' }))));
  }

function renderMain(resetScroll) {
  const main = $('main'), d = S.det, top = main.scrollTop;
  if (!d) { main.replaceChildren(h('div', { class: 'empty', text: S.doc && S.doc.entries.length ? 'Pick something on the left.' : 'The two sides do not differ in anything that matters.' })); return; }
  const startEdit = guard(async () => { if (d.kind === 'text') { const f = await api('/api/entry?i=' + S.i + '&full=1&key=' + encodeURIComponent(d.key)); S.edit = { whole: true, text: f.text }; } else S.edit = { whole: true, text: d.editText }; renderMain(); });
  const acts = [];
  if (d.kind === 'text') acts.push(h('button', { class: 'ours', onclick: guard(() => choose({ side: 'ours' })), title: 'Take OURS for every block here', text: 'All ours' }), h('button', { class: 'theirs', onclick: guard(() => choose({ side: 'theirs' })), title: 'Take THEIRS for every block here', text: 'All theirs' }));
  acts.push(h('button', { onclick: startEdit, text: d.kind === 'text' ? 'Edit whole result' : 'Write my own' }));
  if (d.choice) acts.push(h('button', { onclick: guard(() => choose({ reset: true })) }, 'Start over', h('kbd', { text: 'u' })));
  put(main,
    h('div', { class: 'crumb', text: d.group }),
    h('div', { class: 'title' }, h('h1', { text: d.field }), h('span', { class: 'pill ' + (d.status === 'conflict' ? 'open' : d.status === 'resolved' ? 'done' : 'info'), text: STATUS[d.status] }), h('span', { class: 'crumb', text: d.hint }), h('div', { class: 'actions' }, acts)),
    d.problem ? h('div', { class: 'banner', text: d.problem + '. Pick a side or edit the result.' }) : null,
    d.kind === 'text' ? h('div', { class: 'doc' }, textView(d)) : valueView(d));
  main.scrollTop = resetScroll ? 0 : top;
  if (resetScroll) { const open = main.querySelector('[data-open]'); if (open) open.scrollIntoView({ block: 'center' }); }
}

/* ---------- keys ---------- */
document.addEventListener('keydown', guard(async ev => {
  if (/^(TEXTAREA|INPUT|SELECT)$/.test(ev.target.tagName)) { if (ev.key === 'Escape') ev.target.blur(); return; }
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 's') { ev.preventDefault(); if (!S.doc.preview) await save(false); return; }
  if (ev.metaKey || ev.ctrlKey || ev.altKey || !S.doc) return;
  const rows = visible(), at = rows.findIndex(e => e.key === S.key), d = S.det;
  if (ev.key === 'j' || ev.key === 'ArrowDown') { ev.preventDefault(); if (rows[at + 1]) await select(rows[at + 1].key); }
  else if (ev.key === 'k' || ev.key === 'ArrowUp') { ev.preventDefault(); if (rows[at - 1]) await select(rows[at - 1].key); }
  else if (ev.key === 'n') { const nx = nextConflictKey(); if (nx) await select(nx); else toast('No other open conflict in this file.'); }
  else if (ev.key === 'u' && d && d.choice) await choose({ reset: true });
  else if (d && ['1', '2', '3'].includes(ev.key)) {
    const pick = { 1: 'ours', 2: 'theirs', 3: 'ours+theirs' }[ev.key];
    if (d.kind === 'text') { const c = d.chunks.find(x => x.t === 'conflict' && x.pick == null); if (c) await choose({ hunk: c.i, pick }); }
    else if (ev.key !== '3') await choose({ side: pick });
  }
}));
$('search').addEventListener('input', e => { S.q = e.target.value.trim().toLowerCase(); renderList(); });
guard(async () => { S.docs = await api('/api/docs'); const first = S.docs.find(d => d.open) || S.docs[0]; await loadDoc(first.i); })();
</script>
