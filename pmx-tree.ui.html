<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pmx tree</title>
<style nonce="__NONCE__">
:root {
  --bg: #f4f5f7; --panel: #ffffff; --text: #1b1f24; --muted: #646b75; --line: #e2e5e9; --code: #fbfbfc; --hover: #eef0f3; --sel: #e4e8ff; --accent: #4f52d6;
  --good: #17753f; --good-bg: #e4f6ea; --info: #1a63d8; --info-bg: #e5efff; --warn: #a85400; --warn-bg: #fff3dd; --bad: #b3261e; --bad-bg: #ffeceb;
  --del-bg: #ffeceb; --add-bg: #e6f8ec; --chg-del: #ffc9c4; --chg-add: #b9ebc8; --purple: #7a3fc4; --shadow: 0 1px 2px rgba(20, 24, 30, .06);
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101214; --panel: #181b1f; --text: #e7e9ec; --muted: #98a0aa; --line: #2a2f36; --code: #14171a; --hover: #20242a; --sel: #262a55; --accent: #9ea1ff;
    --good: #4cc487; --good-bg: #10291c; --info: #74a9ff; --info-bg: #11213d; --warn: #f2a94f; --warn-bg: #33240e; --bad: #ff8a80; --bad-bg: #3a1618;
    --del-bg: #3a1618; --add-bg: #10291c; --chg-del: #7a2a2a; --chg-add: #1d5a3a; --purple: #c39bff; --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); display: flex; flex-direction: column; }
button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; cursor: pointer; white-space: nowrap; }
button:hover:not(:disabled) { background: var(--hover); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
@media (prefers-color-scheme: dark) { button.primary { color: #101214; } }
button.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
button.small { padding: 2px 8px; font-size: 12.5px; }
button.danger { color: var(--bad); border-color: var(--bad); }
button.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
button.on { background: var(--sel); border-color: var(--accent); }
input[type=text], input:not([type]), select, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0; }
input.mono, textarea.mono, select.mono { font: 13px/1.5 var(--mono); }
h2 { font-size: 16px; margin: 0; } h3 { font-size: 13px; margin: 22px 0 8px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 650; }
code { font: 12.5px var(--mono); background: var(--hover); padding: 1px 5px; border-radius: 4px; }

header { display: flex; align-items: center; gap: 10px; padding: 9px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header .brand { font-weight: 650; letter-spacing: -.01em; }
header .file { font: 13px var(--mono); max-width: 30vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header .grow, .grow { flex: 1; }
header .actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }
header select { max-width: 200px; padding: 5px 6px; font-size: 13px; }
.pill { font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 0; background: var(--hover); color: var(--muted); }
.pill.good { background: var(--good-bg); color: var(--good); } .pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.info { background: var(--info-bg); color: var(--info); }

.wrap { flex: 1; display: grid; grid-template-columns: minmax(250px, 330px) 1fr; min-height: 0; }
aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.search { margin: 10px 10px 6px; padding: 6px 9px; background: var(--code); }
.treebar { display: flex; align-items: center; gap: 6px; padding: 0 10px 8px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.treebar label { display: flex; align-items: center; gap: 4px; }
.treebar input[type=text] { flex: 1; padding: 3px 7px; font-size: 13px; }
.list { overflow: auto; flex: 1; padding-bottom: 16px; }
.row { display: flex; align-items: center; gap: 7px; padding: 4px 10px 4px 10px; cursor: pointer; border-left: 3px solid transparent; min-height: 28px; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--sel); border-left-color: var(--accent); }
.row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.folder .name, .row.collection .name { font-weight: 600; }
.caret { width: 14px; flex: none; color: var(--muted); font-size: 11px; text-align: center; border: 0; background: none; padding: 0; }
.method { font: 700 10.5px/1 var(--mono); flex: none; min-width: 34px; color: var(--muted); }
.m-GET { color: var(--good); } .m-POST { color: var(--warn); } .m-PUT { color: var(--info); } .m-PATCH { color: var(--purple); } .m-DELETE { color: var(--bad); }
.badge { font: 700 10.5px/1 var(--mono); padding: 3px 5px; border-radius: 4px; flex: none; }
.badge.M { background: var(--info-bg); color: var(--info); } .badge.A { background: var(--good-bg); color: var(--good); } .badge.D, .badge.bad { background: var(--bad-bg); color: var(--bad); }
.inside { width: 7px; height: 7px; border-radius: 50%; background: var(--info); flex: none; margin: 0 6px; opacity: .8; }
.res { font: 600 12px/1 var(--mono); flex: none; } .res.pass { color: var(--good); } .res.fail { color: var(--bad); }
.group { padding: 12px 12px 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.foot { border-top: 1px solid var(--line); padding: 8px 12px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }

main { overflow: auto; min-width: 0; padding: 16px 22px 60px; }
.nodehead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.crumbs { font-size: 13px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.crumbs b { color: var(--text); font-size: 16px; font-weight: 650; }
.tabs2 { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; flex-wrap: wrap; }
.tabs2 button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 7px 12px; color: var(--muted); }
.tabs2 button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tabs2 .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--info); margin-left: 6px; vertical-align: middle; }
.tabbody { max-width: 1180px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 12px; }
.card > h3:first-child { margin-top: 2px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.lab { font-size: 12px; color: var(--muted); font-weight: 600; }
.line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.line > input.grow, .line > .grow { flex: 1; min-width: 200px; }
.kv { width: 100%; border-collapse: collapse; }
.kv td { padding: 2px 4px 2px 0; vertical-align: middle; }
.kv td.chk { width: 26px; } .kv td.del { width: 34px; }
.kv input[type=text], .kv input:not([type]) { width: 100%; }
.kv tr.off input:not([type=checkbox]) { opacity: .5; text-decoration: line-through; }
.kv th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 0 4px 3px 0; }
.hint { font-size: 12.5px; color: var(--muted); margin: 4px 0 8px; }
.hint.bad, .msg.bad { color: var(--bad); } .hint.good { color: var(--good); } .hint.warn { color: var(--warn); }
.banner { border-radius: 8px; padding: 9px 12px; margin-bottom: 12px; font-size: 13px; overflow-wrap: anywhere; white-space: pre-wrap; }
.banner.bad { background: var(--bad-bg); color: var(--bad); } .banner.warn { background: var(--warn-bg); color: var(--warn); } .banner.info { background: var(--info-bg); color: var(--info); } .banner.good { background: var(--good-bg); color: var(--good); }
.empty { color: var(--muted); padding: 26px 0; text-align: center; }
textarea.plain { width: 100%; min-height: 70px; resize: vertical; }

.editor { display: flex; border: 1px solid var(--line); border-radius: 6px; background: var(--code); overflow: hidden; }
.gutter { margin: 0; padding: 8px 8px 8px 10px; text-align: right; color: var(--muted); font: 13px/1.5 var(--mono); user-select: none; overflow: hidden; min-width: 44px; border-right: 1px solid var(--line); opacity: .75; }
textarea.code { flex: 1; border: 0; border-radius: 0; background: var(--code); font: 13px/1.5 var(--mono); padding: 8px 10px; resize: vertical; white-space: pre; overflow: auto; tab-size: 4; min-width: 0; }
textarea.code:focus-visible { outline-offset: -2px; }
.scripthead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.scripthead .fname { font: 12.5px var(--mono); color: var(--muted); overflow-wrap: anywhere; }

table.diff { width: 100%; border-collapse: collapse; table-layout: fixed; font: 12.5px/1.5 var(--mono); background: var(--code); border: 1px solid var(--line); }
table.diff td { padding: 0 6px; vertical-align: top; }
table.diff col.num { width: 46px; } table.diff col.sign { width: 18px; }
table.diff td.num { text-align: right; color: var(--muted); user-select: none; opacity: .8; }
table.diff td.sign { text-align: center; user-select: none; color: var(--muted); }
table.diff td.code { white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 2; }
table.diff tr.add td.code, table.diff td.code.add { background: var(--add-bg); } table.diff tr.del td.code, table.diff td.code.del { background: var(--del-bg); }
table.diff td.code.none { background: var(--hover); opacity: .5; }
table.diff .chg { border-radius: 2px; } table.diff .add .chg, table.diff td.add .chg { background: var(--chg-add); } table.diff .del .chg, table.diff td.del .chg { background: var(--chg-del); }
table.diff tr.gap td { text-align: center; color: var(--muted); background: var(--hover); font-family: var(--sans); font-size: 12px; padding: 2px; }
.filehead { display: flex; align-items: center; gap: 8px; margin: 14px 0 6px; flex-wrap: wrap; }
.filehead .fname { font: 600 12.5px var(--mono); overflow-wrap: anywhere; }
.steps { margin: 6px 0 0; padding-left: 20px; } .steps li { margin: 3px 0; }
.result { padding: 7px 0; border-top: 1px solid var(--line); } .result:first-child { border-top: 0; }
.result .tname { font-weight: 600; } .msg { font: 12.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; margin: 2px 0; }
.hit { display: flex; gap: 10px; padding: 3px 0; align-items: baseline; } .hit .where { font: 12px var(--mono); flex: none; } .hit .txt { font: 12.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
#notes { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; max-width: min(520px, 90vw); z-index: 5; }
.note { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--info); border-radius: 6px; padding: 9px 30px 9px 12px; box-shadow: 0 4px 14px rgba(0,0,0,.14); position: relative; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
.note.bad { border-left-color: var(--bad); } .note.good { border-left-color: var(--good); }
.note .x { position: absolute; top: 4px; right: 4px; border: 0; background: none; padding: 2px 7px; color: var(--muted); }
@media (max-width: 820px) { header .actions { flex-wrap: wrap; margin-left: 0; } .wrap { grid-template-columns: 1fr; grid-template-rows: minmax(140px, 38vh) 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); } header .file { max-width: 60vw; } main { padding: 12px 12px 60px; } }
</style>
</head>
<body>
<header>
  <span class="brand">pmx tree</span>
  <span class="file" id="file"></span>
  <button class="pill" id="pillChanges" title="Show every change"></button>
  <button class="pill" id="pillPack" title="Show what Pack writes into the collection JSON"></button>
  <span class="grow"></span>
  <span class="actions">
    <select id="env" aria-label="Environment file for newman" title="Environment file that newman runs with"></select>
    <button id="btnChanges">All changes</button>
    <button id="btnPreview">Collection JSON</button>
    <button id="btnResults">Results</button>
    <button id="btnPack" title="Build the collection JSON from the files and write it">Pack</button>
    <button id="btnRun" class="primary" title="Pack, then run newman on the result">Run tests</button>
  </span>
</header>
<div class="wrap">
  <aside>
    <input class="search" id="filter" type="text" placeholder="Filter by name - Enter searches every file" aria-label="Filter requests by name; press Enter to search all definitions and scripts">
    <div class="treebar" id="treebar"></div>
    <div class="list" id="tree" role="tree" aria-label="Folders and requests"></div>
    <div class="foot"><div id="foot"></div><div id="saved" role="status"></div></div>
  </aside>
  <main><div id="banners"></div><div id="main"></div></main>
</div>
<div id="notes"></div>
<script nonce="__NONCE__">
'use strict';
/* The page for `pmx tree ui`. It talks only to the pmx process that served it (127.0.0.1) and loads nothing else.
 * Everything from the collection is put on the page as text (textContent), never as HTML. */
const KEY = new URLSearchParams(location.search).get('k');
const $ = id => document.getElementById(id);
const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'selected') el[k] = true;
    else el.setAttribute(k, v === true ? '' : v);
  }
  return add(el, kids);
}
function add(el, ...kids) { for (const kid of kids.flat(4)) if (kid != null && kid !== false) el.append(kid); return el; }   // strings become text nodes
const S = { st: null, pending: null, sel: 'collection.js', node: null, nodeError: '', tab: 'main', view: 'node', diffMode: 'unified', open: null, filter: '', onlyChanged: false, adding: null, focus: null, query: '', running: false, token: 0, leave: null, rawDirty: false, bodies: new Map(), acting: false };
try { if (localStorage.getItem('pmx-tree-diff') === 'split') S.diffMode = 'split'; } catch (e) { /* no storage: fine */ }

/* ---------- talking to pmx ---------- */
async function api(method, url, body) {
  const res = await fetch(url, { method, headers: { 'x-pmx-key': KEY, 'content-type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
  let data;
  try { data = await res.json(); } catch (e) { data = { error: 'pmx gave an answer that is not JSON' }; }
  if (!res.ok) throw Object.assign(new Error(data.error || res.statusText), { stale: !!data.stale });
  return data;
}
const get = (url, q) => api('GET', url + (q ? '?' + new URLSearchParams(q) : ''));
const post = (url, body) => api('POST', url, body || {});
function note(text, kind) {
  const el = h('div', { class: 'note ' + (kind || 'info'), role: kind === 'bad' ? 'alert' : 'status' }, String(text), h('button', { class: 'x', 'aria-label': 'Dismiss', onclick: () => el.remove() }, '×'));
  $('notes').append(el);
  if (kind !== 'bad') setTimeout(() => el.remove(), 7000);
}
async function guard(fn) { try { return await fn(); } catch (e) { note(e.message.includes('Failed to fetch') ? 'pmx is not answering. Is `pmx tree ui` still running in the terminal?' : e.message, 'bad'); return undefined; } }

/* ---------- saving: edits go to the files a moment after typing stops ---------- */
const saves = new Map();
let chain = Promise.resolve(), busy = 0;
function later(key, fn) {
  const old = saves.get(key);
  if (old) clearTimeout(old.timer);
  saves.set(key, { fn, timer: setTimeout(() => saveNow(key), 450) });
  showSaved();
}
function saveNow(key) {
  const job = saves.get(key);
  if (!job) return chain;
  clearTimeout(job.timer); saves.delete(key); busy++; showSaved();
  chain = chain.then(job.fn).catch(e => note(e.message, 'bad')).then(() => { busy--; showSaved(); if (!busy && !saves.size) refresh(); });
  return chain;
}
function flush() { for (const key of [...saves.keys()]) saveNow(key); return chain; }
/* Before moving on: text in the Raw tab that was not applied yet is applied first. If it cannot be (not valid JSON), stay. */
async function ready() {
  if (S.leave) {
    const leave = S.leave, wrote = S.rawDirty;
    if (!(await leave())) return false;                      // (S.leave stays while the Raw tab is shown: Pack and Run leave the tab where it is)
    if (wrote) { await refresh(); await loadNode(); }        // what was written is what the other tabs must show
  }
  await flush();
  return true;
}
function showSaved() { $('saved').textContent = saves.size || busy ? 'Saving…' : S.rawDirty ? 'Raw: not applied yet.' : 'Every edit is saved to the files.'; }

/* ---------- state ---------- */
function findIn(n, id, parent) { if (n.id === id) return { node: n, parent: parent || null }; for (const c of n.children) { const r = findIn(c, id, n); if (r) return r; } return null; }
const isChanged = n => n.status !== 'same' || n.scripts.some(s => s.status !== 'same');
async function refresh() {
  const st = await guard(() => get('/api/state'));
  if (!st) return;
  S.st = st;
  if (!S.open) { let count = 0; (function c(n) { count++; n.children.forEach(c); })(st.root); S.open = new Set(); (function o(n, depth) { if (n.kind !== 'request' && (count <= 150 || depth < 1)) S.open.add(n.id); n.children.forEach(x => o(x, depth + 1)); })(st.root, 0); }
  renderHeader(); renderTree(); renderNodeHead(); renderBanners();
  get('/api/pending').then(p => { S.pending = p; renderHeader(); }).catch(() => {});
}
async function loadNode() {
  try { S.node = await get('/api/node', { id: S.sel }); S.nodeError = ''; }
  catch (e) { S.node = null; S.nodeError = e.message; }
}
async function select(id, opt) {
  if (!(await ready())) return;
  S.sel = id; S.view = 'node'; S.focus = (opt && opt.focus) || null;
  if (opt && opt.tab) S.tab = opt.tab;
  await loadNode();
  if (S.node && S.tab === 'inherited' && S.node.kind === 'collection') S.tab = 'main';
  renderHeader(); renderTree(); renderMain();
}
async function reloadAll() {
  await flush(); await refresh();
  if (S.st && !findIn(S.st.root, S.sel)) S.sel = 'collection.js';
  await loadNode();
  if (saves.size || busy) { await flush(); await loadNode(); }   // something was typed while the files were read: read once more, so the form is not drawn from an older copy
  renderTree(); renderMain();
}
async function show(view) { if (!(await ready())) return; S.view = view; if (view === 'node') await loadNode(); renderHeader(); renderTree(); renderMain(); }

/* ---------- header ---------- */
function renderHeader() {
  const st = S.st;
  if (!st) return;
  $('file').textContent = st.collection; $('file').title = st.collection;
  const c = st.counts, total = c.modified + c.added + c.removed;
  const pc = $('pillChanges');
  pc.textContent = total ? `${total} changed` : 'no changes'; pc.className = 'pill' + (total ? ' info' : '');
  const pp = $('pillPack'), p = S.pending;
  if (!p) { pp.textContent = '…'; pp.className = 'pill'; }
  else if (p.errors.length) { pp.textContent = `cannot pack: ${p.errors.length} problem${p.errors.length > 1 ? 's' : ''}`; pp.className = 'pill bad'; }
  else if (p.held) { pp.textContent = 'the JSON changed: Pack to follow it'; pp.className = 'pill warn'; }
  else if (p.packed) { pp.textContent = total ? 'packed: the JSON holds every edit' : 'JSON untouched'; pp.className = 'pill' + (total ? ' good' : ''); }
  else { pp.textContent = `not packed yet: +${p.added} −${p.removed}`; pp.className = 'pill warn'; }
  pp.title = p && !p.errors.length && !p.packed ? `The edits are in the files, not yet in ${st.collection} (+${p.added} −${p.removed} lines). Click to see them.` : 'Show what Pack writes into the collection JSON';
  const env = $('env');
  if (document.activeElement !== env) {
    env.textContent = '';
    add(env, h('option', { value: '' }, 'No environment'), st.environments.map(e => h('option', { value: e.file, selected: e.file === st.environment, title: e.file }, 'Environment: ' + e.name)));
    env.value = st.environment || '';
  }
  $('btnChanges').className = S.view === 'changes' ? 'on' : ''; $('btnPreview').className = S.view === 'preview' ? 'on' : ''; $('btnResults').className = S.view === 'run' ? 'on' : '';
  const run = st.lastRun;
  $('btnResults').textContent = run ? (run.pass ? `Results: ${run.total} pass` : `Results: ${run.failed} of ${run.total} fail`) : 'Results';
  $('btnRun').disabled = S.running; $('btnRun').textContent = S.running ? 'Running…' : 'Run tests';
  $('btnPack').disabled = S.running;
  $('foot').textContent = `Working copy: ${st.tree}/  →  packs into ${st.collection}`;
}

/* ---------- the tree on the left ---------- */
function runIndex() {
  const m = new Map(), run = S.st && S.st.lastRun;
  if (!run) return m;
  const at = id => { if (!m.has(id)) m.set(id, { pass: 0, fail: 0 }); return m.get(id); };
  for (const a of run.assertions) if (a.id) { if (a.result === 'FAIL') at(a.id).fail++; else if (a.result === 'pass') at(a.id).pass++; }
  for (const e of run.errors) if (e.id) at(e.id).fail++;
  return m;
}
function renderTreebar() {
  const bar = $('treebar');

  S.leave = async () => !S.rawDirty || write();
  ed.ta.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); e.stopPropagation(); apply(); } });
  body.append(h('div', { class: 'hint' }, 'Everything about this ' + (n.kind === 'collection' ? 'collection' : n.kind) + ' as it is kept in ', h('code', {}, n.id), '. ', h('code', {}, '{"$script": "file"}'), ' stands for a script kept in its own file', n.kind === 'request' ? '.' : h('span', {}, ', ', h('code', {}, '{"$children": [...]}'), ' for the requests and folders inside, in order.')),
    ed, h('div', { class: 'line' }, button, h('span', { class: 'hint' }, 'Apply (or Ctrl+S) writes this to the file. So does leaving this tab.')));
  if (S.focus && S.focus.text) { const lines = ed.ta.value.split('\n'), at = lines.findIndex(l => l.toLowerCase().includes(S.focus.text.toLowerCase())); ed.goTo(at < 0 ? 1 : at + 1); S.focus = null; }
}

/* ---------- views of the whole collection ---------- */
async function viewChanges(main) {
  const token = S.token;
  main.append(h('div', { class: 'nodehead' }, h('h2', {}, 'Every change against the collection as it was unpacked'), h('span', { class: 'grow' }), diffToggle(() => renderMain())));
  const list = await guard(() => get('/api/changes'));
  if (!list || token !== S.token) return;
  if (!list.length) main.append(h('div', { class: 'empty' }, 'Nothing was changed yet.'));
  for (const c of list) {
    const letter = c.status === 'added' ? 'A' : c.status === 'removed' ? 'D' : 'M';
    main.append(h('div', { class: 'card' }, h('div', { class: 'scripthead' }, h('span', { class: 'badge ' + letter }, c.status), h('h2', {}, c.path.join(' / ') || c.name), h('span', { class: 'hint' }, c.kind), h('span', { class: 'grow' }),
      c.status === 'removed' ? h('button', { class: 'small', onclick: async () => { if (!(await guard(() => post('/api/revert', { id: c.id })))) return; await reloadAll(); if (!findIn(S.st.root, c.id)) note('It is listed in its folder again, but that folder was removed too. Put the folder back to see it.'); } }, 'Put back') : h('button', { class: 'small', onclick: () => select(c.id, { tab: 'main' }) }, 'Open')),
      c.files.map(f => fileDiff(f))));
  }
}
async function viewPreview(main) {
  const token = S.token, st = S.st;
  main.append(h('div', { class: 'nodehead' }, h('h2', {}, `What Pack writes into ${st.collection}`), h('span', { class: 'grow' }), diffToggle(() => renderMain()), h('button', { class: 'primary', disabled: S.running, onclick: pack }, 'Pack')));
  main.append(h('div', { class: 'card' }, 'The files are a working copy. The collection JSON is what gets kept and merged:',
    h('ol', { class: 'steps' }, h('li', {}, 'Edit here (or edit the files in ', h('code', {}, st.tree + '/'), ' by hand).'), h('li', {}, h('b', {}, 'Run tests'), ' packs and runs newman. ', h('b', {}, 'Pack'), ' only writes the JSON.'),
      h('li', {}, 'Before the branch is merged, run ', h('code', {}, 'pmx tree finish'), ' in the terminal: it packs one last time and removes the files, so that only the collection JSON is merged.'))));
  const p = await guard(() => get('/api/preview'));
  if (!p || token !== S.token) return;
  if (p.errors.length) { main.append(h('div', { class: 'banner bad', role: 'alert' }, 'Pack would be refused:\n' + p.errors.join('\n'))); return; }
  if (p.onto) main.append(h('div', { class: 'banner warn' }, `${st.collection} was changed by something else since it was unpacked (a merge, perhaps). ` + (p.held ? 'It already holds every edit from the files. Pack writes the files again from it.' : 'Pack merges the edits from the files into it and then writes the files again from the result.')));
  if (!p.added && !p.removed) { main.append(h('div', { class: 'empty' }, 'The collection JSON would not change.')); return; }
  main.append(h('div', { class: 'hint' }, `+${p.added} −${p.removed} lines against ${p.onto ? 'the file as it is now' : 'the version that was unpacked'}; ${p.how}. Every other line of the file stays byte for byte as it is.`), diffTable(p.lines, S.diffMode));
}
function viewRun(main) {
  const run = S.st && S.st.lastRun;
  main.append(h('div', { class: 'nodehead' }, h('h2', {}, 'Test results'), h('span', { class: 'grow' }), h('button', { class: 'primary', disabled: S.running, onclick: () => runTests() }, S.running ? 'Running…' : 'Run all tests')));
  if (S.running) main.append(h('div', { class: 'banner info' }, 'newman is running…'));
  if (!run) { main.append(h('div', { class: 'empty' }, 'No run yet. "Run tests" packs the files into the collection JSON and runs newman on it.')); return; }
  main.append(h('div', { class: 'banner ' + (run.pass ? 'good' : 'bad') }, (run.pass ? `PASS — ${run.total} assertions, none failed` : `FAIL — ${run.failed} of ${run.total} assertions failed` + (run.errors.length ? `, ${run.errors.length} error${run.errors.length > 1 ? 's' : ''}` : ''))
    + `\n${run.only ? `Only "${run.only}" was run. ` : ''}Environment: ${run.environment || 'none'}. Finished ${new Date(run.at).toLocaleTimeString()}.`));
  const groups = new Map();
  for (const a of run.assertions) { const key = a.path.join(' / '); if (!groups.has(key)) groups.set(key, { id: a.id, list: [] }); groups.get(key).list.push(a); }
  const failing = [...groups].filter(([, g]) => g.list.some(a => a.result === 'FAIL')), passing = [...groups].filter(([, g]) => !g.list.some(a => a.result === 'FAIL'));
  for (const [title, g] of failing) main.append(h('div', { class: 'card' }, h('div', { class: 'scripthead' }, h('span', { class: 'res fail' }, '✗'), h('h2', {}, title), h('span', { class: 'grow' }), g.id ? h('button', { class: 'small', onclick: () => select(g.id, { tab: 'scripts' }) }, 'Open') : null),
    g.list.filter(a => a.result === 'FAIL').map(a => h('div', { class: 'result' }, h('div', { class: 'tname' }, a.name), h('div', { class: 'msg bad' }, a.message),
      a.file && a.id ? h('button', { class: 'link', onclick: () => select(a.owner || a.id, { tab: 'scripts', focus: { file: a.file, line: a.line } }) }, `${a.file}:${a.line}`) : null)),
    g.list.some(a => a.result === 'pass') ? h('div', { class: 'hint' }, `${g.list.filter(a => a.result === 'pass').length} other assertion(s) of this request passed.`) : null));
  if (run.errors.length) main.append(h('div', { class: 'card' }, h('h3', {}, 'Errors (a script or a request did not run)'), run.errors.map(e => h('div', { class: 'result' }, h('div', { class: 'tname' }, e.path.join(' / ') || '(collection)'), h('div', { class: 'msg bad' }, e.text), e.id ? h('button', { class: 'link', onclick: () => select(e.id, { tab: 'scripts' }) }, 'Open') : null))));
  if (passing.length) main.append(h('div', { class: 'card' }, h('h3', {}, `Passing (${passing.length} request${passing.length > 1 ? 's' : ''})`), passing.map(([title, g]) => h('div', { class: 'hit' }, h('span', { class: 'res pass' }, `✓${g.list.filter(a => a.result === 'pass').length}`), g.id ? h('button', { class: 'link', onclick: () => select(g.id, { tab: 'scripts' }) }, title) : h('span', {}, title)))));
}
async function search(q) { S.query = q; $('filter').value = ''; S.filter = ''; await show('search'); }
async function viewSearch(main) {
  const token = S.token, q = S.query;
  main.append(h('div', { class: 'nodehead' }, h('h2', {}, `Search: ${q}`)));
  const hits = await guard(() => get('/api/search', { q }));
  if (!hits || token !== S.token) return;
  if (!hits.length) { main.append(h('div', { class: 'empty' }, 'Not found in any definition or script.')); return; }
  main.append(h('div', { class: 'hint' }, `${hits.length}${hits.length >= 300 ? ' or more' : ''} line${hits.length === 1 ? '' : 's'} in definitions and scripts.`));
  const groups = new Map();
  for (const x of hits) { if (!groups.has(x.id)) groups.set(x.id, []); groups.get(x.id).push(x); }
  for (const [id, list] of groups) main.append(h('div', { class: 'card' }, h('div', { class: 'scripthead' }, h('h2', {}, list[0].path.join(' / ') || list[0].name), h('span', { class: 'hint' }, list[0].kind), h('span', { class: 'grow' }), h('button', { class: 'small', onclick: () => select(id) }, 'Open')),
    list.map(x => h('div', { class: 'hit' }, h('button', { class: 'link where', onclick: () => select(id, x.script ? { tab: 'scripts', focus: { file: x.file, line: x.line } } : { tab: 'raw', focus: { text: q } }) }, x.script ? `${x.file.split('/').pop()}:${x.line}` : 'definition'), h('span', { class: 'txt', title: x.text }, x.text)))));
}

/* ---------- pack and run ---------- */
async function pack() {
  if (!(await ready())) return;
  const r = await guard(() => post('/api/pack'));
  if (!r) return;
  if (r.errors.length) { note('Pack was refused:\n' + r.errors.join('\n'), 'bad'); S.view = 'preview'; }
  else note(r.held ? `${S.st.collection} had changed and already held every edit. The files were written again from it.` : `Packed into ${S.st.collection}: +${r.added} −${r.removed} lines (${r.how}).` + (r.onto ? '\nThe files were written again from the merged result.' : ''), 'good');
  if (r.apart) note(`Two requests or folders share a name, and the files can no longer be told apart from the newer collection. ${S.st.collection} is right and holds every edit. Close this page and unpack again with --force before you go on.`, 'bad');
  if (r.onto) await reloadAll(); else { await flush(); await refresh(); if (S.view !== 'node') renderMain(); }
  renderHeader();
}
async function runTests(id) {
  if (S.running) return;
  if (!(await ready())) return;
  S.running = true; renderHeader(); if (S.view === 'run') renderMain();
  let r;
  try { r = await post('/api/test', id ? { id } : {}); } catch (e) { note(e.message, 'bad'); }
  S.running = false;
  if (S.rawDirty && !(await ready())) { renderHeader(); return; }      // the Raw text could not be written: stay on it (the results are under "Results")
  if (r && r.errors.length) { note((r.merged ? '' : 'The collection JSON could not be written from the files, so nothing was run:\n') + r.errors.join('\n'), 'bad'); if (!r.merged) S.view = 'preview'; }
  else if (r) { S.view = 'run'; if (r.run.merged) note(`${S.st.collection} had changed since it was unpacked. The edits from the files were merged into it, and the files were written again from the result.`); }
  await reloadAll(); renderHeader();
}

/* ---------- wiring ---------- */
$('btnChanges').addEventListener('click', () => show(S.view === 'changes' ? 'node' : 'changes'));
$('btnPreview').addEventListener('click', () => show(S.view === 'preview' ? 'node' : 'preview'));
$('btnResults').addEventListener('click', () => show(S.view === 'run' ? 'node' : 'run'));
$('pillChanges').addEventListener('click', () => show('changes'));
$('pillPack').addEventListener('click', () => show('preview'));
$('btnPack').addEventListener('click', pack);
$('btnRun').addEventListener('click', () => runTests());
$('env').addEventListener('change', async () => { if (await guard(() => post('/api/environment', { file: $('env').value }))) { await refresh(); if (S.view === 'node' && (S.tab === 'main' || S.tab === 'inherited')) renderMain(); } });
$('filter').addEventListener('input', () => { S.filter = $('filter').value; renderTree(); });
$('filter').addEventListener('keydown', e => { if (e.key === 'Enter' && $('filter').value.trim()) search($('filter').value.trim()); if (e.key === 'Escape') { $('filter').value = ''; S.filter = ''; renderTree(); } });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); flush(); }
  if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { e.preventDefault(); $('filter').focus(); }
});
window.addEventListener('focus', async () => {            // the files may have been edited by hand meanwhile
  if (saves.size || busy || S.running || S.rawDirty || !S.st) return;
  const picture = n => JSON.stringify([n.def, n.scripts.map(x => x.text)]);
  const id = S.sel, was = S.node, before = was ? picture(was) : null;
  await refresh();
  if (S.view !== 'node' || !was) return;
  const now = await get('/api/node', { id }).catch(() => null);
  if (!now || S.node !== was || S.sel !== id || saves.size || busy || S.rawDirty || picture(was) !== before) return;   // something was typed or chosen meanwhile: leave it
  if (picture(now) !== before) { S.node = now; renderMain(); }
  else { was.rev = now.rev; now.scripts.forEach((x, i) => { if (was.scripts[i] && was.scripts[i].file === x.file) was.scripts[i].rev = x.rev; }); }
});
window.addEventListener('pagehide', () => { flush(); });
window.addEventListener('beforeunload', e => { if (S.rawDirty) { e.preventDefault(); e.returnValue = ''; } });
(async () => { showSaved(); renderTreebar(); await refresh(); if (S.st) { await loadNode(); renderMain(); } })();
</script>
</body>
